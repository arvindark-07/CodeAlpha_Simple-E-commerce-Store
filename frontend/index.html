<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopHub - E-Commerce Store</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Header -->
    <header>
        <div class="container">
            <h1 class="logo" onclick="showPage('products')">E Commerce Store</h1>
            <nav>
                <button onclick="showPage('products')" class="nav-btn" id="products-nav">Products</button>
                <button onclick="showPage('orders')" class="nav-btn hidden" id="orders-nav">
                    <span>📦</span> Orders
                </button>
                <button onclick="showPage('cart')" class="nav-btn">
                    <span>🛒</span> Cart
                    <span class="cart-badge" id="cart-count">0</span>
                </button>
                <button onclick="showAuthModal()" class="btn-primary" id="login-btn">
                    <span>👤</span> Login
                </button>
                <button onclick="logout()" class="btn-secondary hidden" id="logout-btn">
                    <span id="user-name"></span> Logout
                </button>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container">
        <!-- Products Page -->
        <div id="products-page" class="page active">
            <h2>Our Products</h2>
            <div id="products-grid" class="products-grid"></div>
        </div>

        <!-- Product Details Page -->
        <div id="product-details-page" class="page">
            <button onclick="showPage('products')" class="btn-back">← Back to Products</button>
            <div id="product-details"></div>
        </div>

        <!-- Cart Page -->
        <div id="cart-page" class="page">
            <h2>Shopping Cart</h2>
            <div id="cart-items"></div>
            <div id="cart-total" class="cart-total"></div>
        </div>

        <!-- Orders Page -->
        <div id="orders-page" class="page">
            <h2>My Orders</h2>
            <div id="orders-list"></div>
        </div>
    </main>

    <!-- Auth Modal -->
    <div id="auth-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeAuthModal()">&times;</span>
            <h2 id="auth-title">Login</h2>
            <form id="auth-form">
                <input type="text" id="auth-name" placeholder="Full Name" class="hidden">
                <input type="email" id="auth-email" placeholder="Email" required>
                <input type="password" id="auth-password" placeholder="Password" required>
                <button type="submit" class="btn-primary">Login</button>
            </form>
            <p class="auth-switch">
                <span id="auth-switch-text">Don't have an account?</span>
                <button onclick="toggleAuthMode()" class="btn-link">Register</button>
            </p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
